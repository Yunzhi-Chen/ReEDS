# Sync this fork's main branch with the upstream ReEDS repository.
#
# Purpose:
#   1. Check upstream ReEDS on a schedule.
#   2. Reconstruct this fork's main as upstream/main plus fork-only automation files.
#   3. Trigger the separate "Update ReEDS-GPT Index" workflow through the resulting push.
#
# Required GitHub Secret:
#   FORK_SYNC_TOKEN - Personal access token or GitHub App token with contents:write
#                     and workflow permission for this fork.
#
# Notes:
#   - Do NOT use the default GITHUB_TOKEN if you want this push to trigger
#     another workflow.
#   - This workflow disables Git LFS smudge so the runner does not try to
#     download large LFS files such as .h5 files.
#   - This workflow intentionally force-pushes main to keep it aligned with
#     upstream/main plus the automation files listed below.
#   - Keep personal development work on separate branches, not main.

name: Sync Fork with Upstream ReEDS

on:
  schedule:
    # Check upstream every day at 08:00 UTC
    - cron: "0 8 * * *"

  workflow_dispatch:

concurrency:
  group: sync-upstream-reeds
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/NREL/ReEDS-2.0.git
  UPSTREAM_BRANCH: main
  FORK_BRANCH: main
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork without LFS objects
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          persist-credentials: true
          lfs: false

      - name: Configure git identity and disable LFS smudge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install --skip-smudge
          git config --local filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --local filter.lfs.process "git-lfs filter-process --skip"
          git config --local filter.lfs.required false

      - name: Add upstream remote and fetch branches
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          git fetch origin "$FORK_BRANCH"

      - name: Save fork-only automation files
        run: |
          mkdir -p /tmp/fork-automation/.github/workflows
          mkdir -p /tmp/fork-automation/.github/scripts

          cp .github/workflows/sync-upstream.yml \
             /tmp/fork-automation/.github/workflows/sync-upstream.yml

          cp .github/workflows/update-index.yml \
             /tmp/fork-automation/.github/workflows/update-index.yml

          cp .github/scripts/build_reeds_index.py \
             /tmp/fork-automation/.github/scripts/build_reeds_index.py

      - name: Reconstruct main from upstream plus automation files
        id: reconstruct
        run: |
          BEFORE_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse upstream/$UPSTREAM_BRANCH)"

          echo "before_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          git checkout "$FORK_BRANCH"

          # Reset the working tree to upstream/main.
          # This avoids rebase conflicts from unrelated or imported fork history.
          git reset --hard "upstream/$UPSTREAM_BRANCH"

          # Restore fork-only automation files.
          mkdir -p .github/workflows
          mkdir -p .github/scripts

          cp /tmp/fork-automation/.github/workflows/sync-upstream.yml \
             .github/workflows/sync-upstream.yml

          cp /tmp/fork-automation/.github/workflows/update-index.yml \
             .github/workflows/update-index.yml

          cp /tmp/fork-automation/.github/scripts/build_reeds_index.py \
             .github/scripts/build_reeds_index.py

          git add .github/workflows/sync-upstream.yml \
                  .github/workflows/update-index.yml \
                  .github/scripts/build_reeds_index.py

          if git diff --cached --quiet && [ "$BEFORE_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork main already matches upstream plus automation files."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "Sync fork with upstream ReEDS and preserve automation files"
          fi

      - name: Push updated fork main
        if: steps.reconstruct.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin "$FORK_BRANCH"

      - name: Summary
        run: |
          echo "Fork before sync: ${{ steps.reconstruct.outputs.before_sha }}"
          echo "Upstream:         ${{ steps.reconstruct.outputs.upstream_sha }}"
          echo "Changed:          ${{ steps.reconstruct.outputs.changed }}"

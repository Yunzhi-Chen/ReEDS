# Sync this fork's main branch with the upstream ReEDS repository.
#
# Purpose:
#   1. Check upstream ReEDS on a schedule.
#   2. Rebase fork-only automation commits on top of upstream/main when upstream changes.
#   3. Trigger the separate "Update ReEDS-GPT Index" workflow through the resulting push.
#
# Required GitHub Secret:
#   FORK_SYNC_TOKEN - Personal access token or GitHub App token with contents:write
#                     permission for this fork.
#
# Notes:
#   - Do NOT use the default GITHUB_TOKEN if you want this push to trigger
#     another workflow.
#   - This workflow assumes your fork's main may contain fork-only commits,
#     such as GitHub Actions files that are not present in upstream ReEDS.

name: Sync Fork with Upstream ReEDS

on:
  schedule:
    # Check upstream every day at 08:00 UTC
    - cron: "0 8 * * *"

  workflow_dispatch:

concurrency:
  group: sync-upstream-reeds
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/NREL/ReEDS-2.0.git
  UPSTREAM_BRANCH: main
  FORK_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch branches
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          git fetch origin "$FORK_BRANCH"

      - name: Check whether fork already contains latest upstream
        id: check
        run: |
          LOCAL_SHA="$(git rev-parse origin/$FORK_BRANCH)"
          UPSTREAM_SHA="$(git rev-parse upstream/$UPSTREAM_BRANCH)"

          echo "local_sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          # If upstream/main is already an ancestor of origin/main,
          # then the fork already contains the latest upstream commit.
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" "origin/$FORK_BRANCH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork already contains latest upstream commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits not yet in the fork."
            echo "Fork:     $LOCAL_SHA"
            echo "Upstream: $UPSTREAM_SHA"
          fi

      - name: Rebase fork main on upstream main
        if: steps.check.outputs.changed == 'true'
        run: |
          git checkout "$FORK_BRANCH"

          # Rebase fork-only commits, such as workflow files, on top of upstream/main.
          git rebase "upstream/$UPSTREAM_BRANCH"

          # Rebase rewrites fork-only commit SHAs, so force-with-lease is needed.
          git push --force-with-lease origin "$FORK_BRANCH"

      - name: Summary
        run: |
          echo "Fork before sync: ${{ steps.check.outputs.local_sha }}"
          echo "Upstream:         ${{ steps.check.outputs.upstream_sha }}"
          echo "Changed:          ${{ steps.check.outputs.changed }}"
